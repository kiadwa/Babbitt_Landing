name = "babbitt-eo-bridge"
main = "src/worker.js"
compatibility_date = "2024-09-01"

[vars]
# ─── Email Octopus list ───────────────────────────────────────────────────
# EmailOctopus recommends ONE list, segmented by fields + tags — so normally
# you only fill EO_LIST_DEFAULT. Every form lands there; the icp_lane field and
# the lane:* / source:* tags let you segment inside it.
EO_LIST_DEFAULT   = "665970a6-6a21-11f1-94b7-4113fc49f2d9"   # REQUIRED — your single list's UUID.

# Optional: only set a lane below if you ever want it on its OWN separate list.
# Any left empty automatically falls back to EO_LIST_DEFAULT.
EO_LIST_TRADES    = ""
EO_LIST_OWNERS    = ""
EO_LIST_MANAGERS  = ""
EO_LIST_STRATA    = ""
EO_LIST_SUPPLIERS = ""

# Origin(s) allowed to call the worker via AJAX (the pricing-lock modal).
# Comma-separated. Native form posts don't need this, but it's harmless.
ALLOWED_ORIGIN = "https://babbitt.app,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://localhost:8000"

# Dual-send: mirror every submission to FormSubmit so Bruno's inbox still
# gets a copy during rollout. Set to "" to turn the mirror off later.
FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/db2386c230f1fd46e7c207920bbf4508"

# Fallback redirect for native form posts that omit a _next field.
DEFAULT_NEXT = "https://babbitt.app/#user_waitlist_submitted"

# ─── SECRET — do NOT put the API key here ─────────────────────────────────
# Set it once with:  npx wrangler secret put EO_API_KEY
